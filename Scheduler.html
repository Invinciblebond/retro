<meta property="og:description" content="Plan the week hour by hour: blocks, repeats and a running agenda."/>
<meta name="twitter:card" content="summary_large_image"/>

<meta name="twitter:description" content="Plan the week hour by hour: blocks, repeats and a running agenda."/>

<style>
body{overflow:hidden}
.shell{display:flex;height:100%}
main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}

.hdr{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line-soft);flex-shrink:0}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:-.02em}
.hdr .when{font-size:12px;color:var(--muted);margin-left:12px}
.burger{display:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px}
.burger svg{width:20px;height:20px}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--line-soft);color:var(--muted);cursor:pointer}
.nav button:hover{color:#fff;background:rgba(255,255,255,.12)}
.nav svg{width:14px;height:14px}

.body{flex:1;display:grid;grid-template-columns:1fr 288px;min-height:0}
@media(max-width:1080px){.body{grid-template-columns:1fr}.side{display:none}}
@media(max-width:820px){.burger{display:block}}

/* ── week grid ─────────────────────────────────────────────────────────── */
.cal{overflow:auto;position:relative}
.cal-head{display:grid;grid-template-columns:56px repeat(7,1fr);position:sticky;top:0;z-index:5;
  background:var(--black);border-bottom:1px solid var(--line-soft)}
.dh{padding:10px 6px;text-align:center;border-left:1px solid var(--line-soft)}
.dh b{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.dh i{display:block;font-style:normal;font-size:17px;font-weight:600;margin-top:3px}
.dh.today b{color:var(--accent)}
.dh.today i{color:var(--accent)}
.grid-body{display:grid;grid-template-columns:56px repeat(7,1fr);position:relative}
.hours{border-right:1px solid var(--line-soft)}
.hour-lbl{height:44px;font-size:10px;color:var(--faint);text-align:right;padding:2px 7px 0 0;
  border-top:1px solid transparent}
.col{position:relative;border-left:1px solid var(--line-soft)}
.col.today{background:rgba(0,255,163,.025)}
.slot{height:44px;border-top:1px solid var(--line-soft);cursor:pointer;transition:background .12s}
.slot:hover{background:rgba(255,255,255,.05)}
.now-line{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--accent);z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 7px;overflow:hidden;cursor:pointer;
  border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 17%,transparent);z-index:2;
  transition:filter .12s,transform .12s}
.ev:hover{filter:brightness(1.35)}
.ev b{display:block;font-size:11.5px;font-weight:600;color:#fff;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;font-size:10px;color:rgba(255,255,255,.66);margin-top:1px}
.ev.done{opacity:.45}
.ev.done b{text-decoration:line-through}

/* ── agenda rail ───────────────────────────────────────────────────────── */
.side{border-left:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0}
.side-head{padding:16px 18px 10px}
.side-head h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.side-head p{font-size:11px;color:var(--faint);margin-top:4px}
.agenda{flex:1;overflow-y:auto;padding:6px 14px 18px;display:flex;flex-direction:column;gap:6px}
.ag{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:11px;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid var(--line-soft);transition:background .12s}
.ag:hover{background:rgba(255,255,255,.07)}
.ag .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--c);flex-shrink:0}
.ag b{display:block;font-size:12.5px;font-weight:500;color:#e8e8e8}
.ag span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.ag.done b{text-decoration:line-through;color:var(--faint)}
.ag-empty{font-size:12px;color:var(--faint);padding:18px 4px;text-align:center;line-height:1.6}
.side-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft)}
.st{padding:10px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft)}
.st p{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin-bottom:5px}
.st div{font-size:16px;font-weight:600}

/* ── modal ─────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px}
.scrim.open{display:flex}
.sheet{width:100%;max-width:430px;max-height:90vh;overflow-y:auto;border-radius:22px;padding:22px;
  background:#0d0d0d;border:1px solid var(--line)}
.sheet h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px}
.chk input{width:15px;height:15px;accent-color:var(--accent)}
.sheet-foot{display:flex;gap:8px;margin-top:6px}
.sheet-foot .btn{flex:1}
.del{background:transparent;border:1px solid rgba(248,113,113,.3);color:var(--danger)}
.del:hover{background:rgba(248,113,113,.12)}
</style>
</head>
<body class="dot-grid" data-page="app">

<div class="shell">
<script src="assets/sidebar.js"></script>

<main>
  <header class="hdr">
    <div style="display:flex;align-items:center;gap:8px;min-width:0">
      <button class="burger" id="burger" aria-label="Menu">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-width="2"/></svg>
      </button>
      <h1>Scheduler</h1>
      <span class="when" id="range-label">…</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="nav">
        <button id="prev" aria-label="Previous week"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></button>
        <button id="next" aria-label="Next week"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></button>
      </div>
      <button class="btn btn-ghost btn-sm" id="today-btn">Today</button>
      <button class="btn btn-white btn-sm" id="new-btn">New block</button>
    </div>
  </header>

  <div class="body">
    <div class="cal" id="cal">
      <div class="cal-head" id="cal-head"></div>
      <div class="grid-body" id="grid-body"></div>
    </div>

    <aside class="side">
      <div class="side-head">
        <h2>Agenda</h2>
        <p id="agenda-day">…</p>
      </div>
      <div class="agenda" id="agenda"></div>
      <div class="side-stats">
        <div class="st"><p>Blocks this week</p><div id="stat-count">0</div></div>
        <div class="st"><p>Hours booked</p><div id="stat-hours">0</div></div>
      </div>
    </aside>
  </div>
</main>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <h2 id="sheet-title">New block</h2>
    <form id="ev-form" novalidate>
      <div class="fld">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" placeholder="Gym, deep work, call…" autocomplete="off" required/>
      </div>
      <div class="row2">
        <div class="fld"><label for="f-date">Date</label><input id="f-date" type="date" required/></div>
        <div class="fld"><label for="f-dur">Length (min)</label><input id="f-dur" type="number" min="15" step="15" value="60"/></div>
      </div>
      <div class="row2">
        <div class="fld"><label for="f-start">Start</label><input id="f-start" type="time" step="900" required/></div>
        <div class="fld"><label for="f-repeat">Repeat</label>
          <select id="f-repeat">
            <option value="none">Once</option>
            <option value="daily">Every day</option>
            <option value="weekly">Every week</option>
            <option value="weekdays">Weekdays</option>
          </select>
        </div>
      </div>
      <div class="fld">
        <label for="f-note">Note</label>
        <input id="f-note" type="text" placeholder="Optional" autocomplete="off"/>
      </div>
      <div class="fld">
        <label>Colour</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <label class="chk"><input type="checkbox" id="f-done"/> Mark as done</label>
      <div class="sheet-foot">
        <button type="button" class="btn btn-sm del" id="f-delete" hidden>Delete</button>
        <button type="button" class="btn btn-ghost btn-sm" id="f-cancel">Cancel</button>
        <button type="submit" class="btn btn-white btn-sm">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/env.js"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/auth.js"></script>
<script>
/* ============================================================================
   Scheduler. One localStorage key holds every block; assets/sync.js mirrors it
   to the account, so the week follows the user between devices.
   A block is { id, title, date:'YYYY-MM-DD', start:'HH:MM', mins, colour,
   note, repeat:'none|daily|weekly|weekdays', done:{ 'YYYY-MM-DD':true } }.
   Repeats are expanded on read from their seed date onward, never stored.
   ========================================================================== */
var KEY = 'aura_scheduler_v1';
var COLOURS = ['#00ffa3','#38bdf8','#a78bfa','#f472b6','#f5a623','#f87171','#c9b87a'];
var DAY_MS = 864e5, ROW = 44, START_HOUR = 6, END_HOUR = 23;

var blocks = [];
var anchor = startOfWeek(new Date());   // Monday of the week on screen
var selectedDay = ymd(new Date());
var editing = null, pickedColour = COLOURS[0];

/* ---------- dates ---------- */
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function startOfWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function minsOf(t){var p=t.split(':');return (+p[0])*60+(+p[1])}
function hhmm(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function label12(m){var h=Math.floor(m/60)%24,mm=m%60,ap=h<12?'am':'pm',h12=h%12||12;
  return h12+(mm?':'+pad(mm):'')+ap}

/* ---------- store ---------- */
function load(){
  try{ var raw=localStorage.getItem(KEY); blocks = raw?JSON.parse(raw):[]; }
  catch(e){ blocks=[]; }
  if(!Array.isArray(blocks)) blocks=[];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(blocks)); }catch(e){}
  if(window.auraSync && window.auraSync.push) window.auraSync.push();
}

/* ---------- occurrences ---------- */
// Every block that actually lands on `date`, sorted by start time.
function occurrences(date){
  var d = parseYmd(date), out = [];
  blocks.forEach(function(b){
    var seed = parseYmd(b.date);
    if (d < seed) return;
    var diff = Math.round((d - seed) / DAY_MS);
    var hit = b.repeat === 'daily'   ? true
            : b.repeat === 'weekly'  ? diff % 7 === 0
            : b.repeat === 'weekdays'? d.getDay() >= 1 && d.getDay() <= 5
            : diff === 0;
    if (hit) out.push(b);
  });
  return out.sort(function(a,b){ return minsOf(a.start) - minsOf(b.start) });
}
function isDone(b,date){ return !!(b.done && b.done[date]) }

/* ---------- render ---------- */
function render(){
  var head=document.getElementById('cal-head'), body=document.getElementById('grid-body');
  var todayY = ymd(new Date());
  var days=[], i;
  for(i=0;i<7;i++) days.push(addDays(anchor,i));

  document.getElementById('range-label').textContent =
    days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' to ' +
    days[6].toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});

  head.innerHTML = '<div></div>' + days.map(function(d){
    var on = ymd(d)===todayY ? ' today' : '';
    return '<div class="dh'+on+'"><b>'+d.toLocaleDateString(undefined,{weekday:'short'})+'</b><i>'+d.getDate()+'</i></div>';
  }).join('');

  var hours='';
  for(i=START_HOUR;i<=END_HOUR;i++) hours += '<div class="hour-lbl">'+label12(i*60)+'</div>';

  var cols = days.map(function(d){
    var date=ymd(d), slots='';
    for(i=START_HOUR;i<=END_HOUR;i++)
      slots += '<div class="slot" data-date="'+date+'" data-hour="'+i+'"></div>';
    var evs = occurrences(date).map(function(b){
      var top = (minsOf(b.start) - START_HOUR*60) / 60 * ROW;
      var h   = Math.max(22, (b.mins/60)*ROW - 3);
      return '<div class="ev'+(isDone(b,date)?' done':'')+'" style="--c:'+b.colour+
             ';top:'+top+'px;height:'+h+'px" data-id="'+b.id+'" data-date="'+date+'">'+
             '<b>'+esc(b.title)+'</b><span>'+label12(minsOf(b.start))+' · '+b.mins+'m</span></div>';
    }).join('');
    return '<div class="col'+(date===todayY?' today':'')+'">'+slots+evs+
           (date===todayY?nowLine():'')+'</div>';
  }).join('');

  body.innerHTML = '<div class="hours">'+hours+'</div>'+cols;
  renderAgenda();
  renderStats(days);
}

function nowLine(){
  var n=new Date(), m=n.getHours()*60+n.getMinutes();
  if(m < START_HOUR*60 || m > (END_HOUR+1)*60) return '';
  return '<div class="now-line" style="top:'+((m-START_HOUR*60)/60*ROW)+'px"></div>';
}

function renderAgenda(){
  var list=document.getElementById('agenda'), d=parseYmd(selectedDay);
  document.getElementById('agenda-day').textContent =
    d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  var evs=occurrences(selectedDay);
  if(!evs.length){
    list.innerHTML='<div class="ag-empty">Nothing booked.<br/>Click any slot to add a block.</div>';
    return;
  }
  list.innerHTML = evs.map(function(b){
    return '<div class="ag'+(isDone(b,selectedDay)?' done':'')+'" style="--c:'+b.colour+
           '" data-id="'+b.id+'" data-date="'+selectedDay+'">'+
           '<div class="bar"></div><div style="min-width:0"><b>'+esc(b.title)+'</b>'+
           '<span>'+label12(minsOf(b.start))+' to '+label12(minsOf(b.start)+b.mins)+
           (b.note?' · '+esc(b.note):'')+'</span></div></div>';
  }).join('');
}

function renderStats(days){
  var count=0, mins=0;
  days.forEach(function(d){
    occurrences(ymd(d)).forEach(function(b){ count++; mins+=b.mins });
  });
  document.getElementById('stat-count').textContent=count;
  document.getElementById('stat-hours').textContent=(mins/60).toFixed(1);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------- modal ---------- */
function paintSwatches(){
  document.getElementById('swatches').innerHTML = COLOURS.map(function(c){
    return '<span class="sw'+(c===pickedColour?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></span>';
  }).join('');
}
function openSheet(block, date, hour){
  editing = block || null;
  document.getElementById('sheet-title').textContent = block ? 'Edit block' : 'New block';
  document.getElementById('f-title').value  = block ? block.title : '';
  document.getElementById('f-date').value   = block ? block.date  : (date || selectedDay);
  document.getElementById('f-start').value  = block ? block.start : hhmm((hour!=null?hour:9)*60);
  document.getElementById('f-dur').value    = block ? block.mins  : 60;
  document.getElementById('f-repeat').value = block ? block.repeat: 'none';
  document.getElementById('f-note').value   = block ? (block.note||'') : '';
  document.getElementById('f-done').checked = block ? isDone(block, date || block.date) : false;
  document.getElementById('f-done').dataset.date = date || (block ? block.date : selectedDay);
  document.getElementById('f-delete').hidden = !block;
  pickedColour = block ? block.colour : COLOURS[0];
  paintSwatches();
  document.getElementById('scrim').classList.add('open');
  setTimeout(function(){document.getElementById('f-title').focus()},40);
}
function closeSheet(){ document.getElementById('scrim').classList.remove('open'); editing=null }

document.getElementById('swatches').addEventListener('click',function(e){
  var sw=e.target.closest('.sw'); if(!sw)return;
  pickedColour=sw.dataset.c; paintSwatches();
});
document.getElementById('f-cancel').addEventListener('click',closeSheet);
document.getElementById('scrim').addEventListener('click',function(e){ if(e.target===this) closeSheet() });
addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet() });

document.getElementById('ev-form').addEventListener('submit',function(e){
  e.preventDefault();
  var title=document.getElementById('f-title').value.trim();
  if(!title){ document.getElementById('f-title').focus(); return }
  var doneBox=document.getElementById('f-done'), doneDate=doneBox.dataset.date;
  var b = editing || { id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), done:{} };
  b.title  = title;
  b.date   = document.getElementById('f-date').value || selectedDay;
  b.start  = document.getElementById('f-start').value || '09:00';
  b.mins   = Math.max(15, parseInt(document.getElementById('f-dur').value,10) || 60);
  b.repeat = document.getElementById('f-repeat').value;
  b.note   = document.getElementById('f-note').value.trim();
  b.colour = pickedColour;
  b.done   = b.done || {};
  if(doneBox.checked) b.done[doneDate] = true; else delete b.done[doneDate];
  if(!editing) blocks.push(b);
  save(); closeSheet(); render();
});

document.getElementById('f-delete').addEventListener('click',function(){
  if(!editing || !confirm('Delete "'+editing.title+'"?')) return;
  blocks = blocks.filter(function(b){ return b.id !== editing.id });
  save(); closeSheet(); render();
});

/* ---------- interaction ---------- */
document.getElementById('grid-body').addEventListener('click',function(e){
  var ev=e.target.closest('.ev');
  if(ev){
    var b=blocks.filter(function(x){return x.id===ev.dataset.id})[0];
    if(b){ selectedDay=ev.dataset.date; openSheet(b, ev.dataset.date); renderAgenda(); }
    return;
  }
  var slot=e.target.closest('.slot');
  if(slot){ selectedDay=slot.dataset.date; renderAgenda(); openSheet(null, slot.dataset.date, +slot.dataset.hour); }
});
document.getElementById('agenda').addEventListener('click',function(e){
  var ag=e.target.closest('.ag'); if(!ag)return;
  var b=blocks.filter(function(x){return x.id===ag.dataset.id})[0];
  if(b) openSheet(b, ag.dataset.date);
});
document.getElementById('cal-head').addEventListener('click',function(e){
  var dh=e.target.closest('.dh'); if(!dh)return;
  var idx=Array.prototype.indexOf.call(this.children, dh) - 1;
  if(idx>=0){ selectedDay=ymd(addDays(anchor,idx)); renderAgenda(); }
});
document.getElementById('prev').addEventListener('click',function(){ anchor=addDays(anchor,-7); render() });
document.getElementById('next').addEventListener('click',function(){ anchor=addDays(anchor,7);  render() });
document.getElementById('today-btn').addEventListener('click',function(){
  anchor=startOfWeek(new Date()); selectedDay=ymd(new Date()); render(); scrollToNow();
});
document.getElementById('new-btn').addEventListener('click',function(){ openSheet(null, selectedDay, 9) });
document.getElementById('burger').addEventListener('click',function(){
  window.auraSidebar && window.auraSidebar.toggleMobile();
});

function scrollToNow(){
  var n=new Date(), m=n.getHours()*60+n.getMinutes();
  var y=Math.max(0,(m-START_HOUR*60)/60*ROW - 140);
  document.getElementById('cal').scrollTop=y;
}

load();
render();
scrollToNow();
setInterval(render, 60000);   // keep the now-line honest
</script>
</body>
</html>
